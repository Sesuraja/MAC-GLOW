<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist - Mac & Glow</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.wishlist-page{max-width:1200px;margin:0 auto;padding:8rem 1.5rem 4rem;min-height:60vh}
.wishlist-page h1{font-family:var(--font-serif);font-size:2rem;color:var(--deep);margin-bottom:0.5rem}
.wishlist-page .subtitle{color:var(--muted);margin-bottom:2rem}
.wishlist-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem}
.wishlist-card{background:white;border-radius:12px;border:1px solid var(--border);overflow:hidden;position:relative}
.wishlist-card img{width:100%;height:200px;object-fit:cover}
.remove-btn{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.5);color:white;border:none;width:30px;height:30px;border-radius:50%;cursor:pointer}
.remove-btn:hover{background:#c4856a}
.wishlist-info{padding:1rem}
.wishlist-info h3{font-size:1rem;margin-bottom:0.3rem}
.wishlist-price{color:#c4856a;font-weight:bold;margin-bottom:0.5rem}
.add-cart-btn{width:100%;padding:0.5rem;background:#2c2018;color:white;border:none;cursor:pointer;border-radius:6px}
.add-cart-btn:hover{background:#c4856a}
.empty-wishlist{text-align:center;padding:3rem}
.empty-wishlist .icon{font-size:4rem}
.login-msg{text-align:center;padding:3rem}
.login-msg .icon{font-size:4rem}
.btn-login{display:inline-block;background:#2c2018;color:white;padding:0.8rem 2rem;text-decoration:none;border-radius:8px;margin-top:1rem}
@media(max-width:1024px){.wishlist-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:768px){.wishlist-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.wishlist-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<nav id="navbar">
<div class="nav-inner">
<a href="index.html" class="logo">MAC<span>&</span>GLOW</a>
<ul class="nav-links" id="navLinks">
<li><a href="index.html">Home</a></li>
<li><a href="shop.html">Shop</a></li>
<li><a href="routines.html">Routines</a></li>
<li><a href="ingredients.html">Ingredients</a></li>
<li><a href="about.html">About</a></li>
<li><a href="journal.html">Journal</a></li>
</ul>
<div class="nav-actions">
<button class="icon-btn cart-btn" onclick="toggleCart()">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
<span class="cart-count" id="cartCount">0</span>
</button>
<button class="hamburger" id="hamburger" onclick="toggleMenu()"><span></span><span></span><span></span></button>
</div>
</div>
</nav>

<div class="wishlist-page" id="wishlistPage"></div>

<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-sidebar" id="cartSidebar">
<div class="cart-header"><h3>Your Cart <span id="cartItemCount">(0)</span></h3><button onclick="toggleCart()">✕</button></div>
<div class="cart-items" id="cartItems"></div>
<div class="cart-footer" id="cartFooter" style="display:none"><div class="cart-total"><span>Subtotal</span><strong id="cartTotal">₹0</strong></div><p class="cart-note">Free shipping above ₹699</p><a href="checkout.html" class="btn-primary" style="width:100%;text-align:center;display:block;">Checkout →</a></div>
</div>
<div class="toast" id="toast"></div>

<footer style="background:var(--deep);padding:2rem 0;margin-top:3rem">
<div class="container" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem">
<a href="index.html" class="logo" style="color:#FAF7F2">MAC<span style="color:#C4856A">&</span>GLOW</a>
<p style="font-size:0.75rem;color:rgba(250,247,242,0.3)">© 2026 Mac & Glow Skincare. All rights reserved.</p>
</div>
</footer>

<script src="data.js"></script>
<script src="api.js"></script>
<script src="cart.js"></script>
<script src="main.js"></script>
<script src="nav.js"></script>
<script src="chatbot.js"></script>

<script>
function getUser(){
var s = localStorage.getItem('mg_session') || sessionStorage.getItem('mg_session');
return s ? JSON.parse(s) : null;
}

function getLocalWishlist(){
var w = localStorage.getItem('wishlist');
return w ? JSON.parse(w) : [];
}

function saveLocalWishlist(w){
localStorage.setItem('wishlist', JSON.stringify(w));
}

function removeItem(id){
MG_API.removeFromWishlist(id).then(function(){
    loadPage();
    showToast('Removed from wishlist');
}).catch(function(){
    var w = getLocalWishlist();
    w = w.filter(function(i){ return i.id != id && i.productId != id });
    saveLocalWishlist(w);
    loadPage();
    showToast('Removed from wishlist');
});
}

function addToCartWishlist(name, price){
addToCart(name, price);
showToast(name + ' added to cart!');
}

function renderWishlist(wishlist){
var container = document.getElementById('wishlistPage');
if(!wishlist || wishlist.length === 0){
    container.innerHTML = '<div class="empty-wishlist"><div class="icon">♥️</div><h3>Your wishlist is empty</h3><p>Save your favorite products here</p><a href="shop.html" class="btn-login">Shop Now →</a></div>';
    return;
}
var html = '<h1>My Wishlist</h1><p class="subtitle">You have ' + wishlist.length + ' items saved</p><div class="wishlist-grid">';
for(var i=0; i<wishlist.length; i++){
    var p = wishlist[i];
    var pid = p.productId || p.id;
    html += '<div class="wishlist-card">';
    html += '<button class="remove-btn" onclick="removeItem(' + pid + ')">✕</button>';
    html += '<div class="wishlist-img" style="background:' + (p.bg || '#E4D6CC') + ';height:180px;display:flex;align-items:center;justify-content:center;font-size:3rem">' + (p.icon || '✨') + '</div>';
    html += '<div class="wishlist-info">';
    html += '<h3>' + p.name + '</h3>';
    html += '<div class="wishlist-price">₹' + Number(p.price).toLocaleString() + '</div>';
    html += '<button class="add-cart-btn" onclick="addToCartWishlist(\'' + p.name.replace(/'/g, "\\'") + '\', ' + p.price + ')">Add to Cart</button>';
    html += '</div></div>';
}
html += '</div>';
container.innerHTML = html;
}

function loadPage(){
var user = getUser();
var container = document.getElementById('wishlistPage');

if(!user){
    container.innerHTML = '<div class="login-msg"><div class="icon">🔐</div><h3>Login Required</h3><p>Please login to view your wishlist</p><a href="login.html" class="btn-login">Login →</a></div>';
    return;
}

container.innerHTML = '<div class="empty-wishlist"><div class="icon">⏳</div><h3>Loading...</h3></div>';

MG_API.getWishlist().then(function(data){
    renderWishlist(data.wishlist || []);
}).catch(function(){
    var local = getLocalWishlist();
    if(local.length > 0){
    renderWishlist(local);
    } else {
    container.innerHTML = '<div class="empty-wishlist"><div class="icon">♥️</div><h3>Your wishlist is empty</h3><p>Save your favorite products here</p><a href="shop.html" class="btn-login">Shop Now →</a></div>';
    }
});
}

function addToWishlistFromShop(id, name, price, icon, bg){
var user = getUser();
if(!user){
    showToast('Please login first');
    setTimeout(function(){ window.location.href = 'login.html'; }, 1000);
    return;
}
MG_API.addToWishlist({ productId: id, name: name, price: price, icon: icon, bg: bg }).then(function(){
    showToast('Added to wishlist ♥');
}).catch(function(){
    var w = getLocalWishlist();
    var exists = w.some(function(i){ return i.id == id || i.productId == id });
    if(!exists){
    w.push({id:id, name:name, price:price, icon:icon, bg:bg});
    saveLocalWishlist(w);
    }
    showToast('Added to wishlist ♥');
});
}

document.addEventListener('DOMContentLoaded', function(){
loadPage();
if(typeof updateCartUI === 'function') updateCartUI();
});
</script>
</body>
</html>
