<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Order — Mac & Glow</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.track-container{max-width:800px;margin:0 auto;padding:8rem 1.5rem 6rem;min-height:70vh}
.track-card{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);padding:2rem}
.track-header{text-align:center;margin-bottom:2rem}
.track-header .icon{font-size:3rem;margin-bottom:0.5rem}
.track-header h1{font-family:var(--font-serif);font-size:1.8rem;color:var(--deep);margin-bottom:0.5rem}
.track-header p{color:var(--muted);font-size:0.85rem}
.track-form{margin-bottom:2rem}
.order-input-group{display:flex;gap:1rem;margin-top:1rem}
.order-input-group input{flex:1;padding:0.85rem 1rem;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font-sans);font-size:0.9rem;outline:none}
.order-input-group input:focus{border-color:var(--rose)}
.order-input-group button{padding:0.85rem 1.5rem;background:var(--deep);color:var(--cream);border:none;border-radius:var(--radius-sm);cursor:pointer;font-family:var(--font-sans);font-weight:500}
.order-input-group button:hover{background:var(--rose)}
.order-details{border-top:1px solid var(--border);padding-top:1.5rem;margin-top:1rem}
.order-status{display:flex;justify-content:space-between;margin:1.5rem 0}
.status-step{text-align:center;flex:1}
.status-step .step-circle{width:40px;height:40px;background:var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 0.5rem;font-weight:600;color:var(--muted)}
.status-step.completed .step-circle{background:var(--rose);color:white}
.status-step.active .step-circle{background:var(--gold);color:white;border:2px solid var(--rose)}
.status-step .step-label{font-size:0.7rem;color:var(--muted);text-transform:uppercase}
.status-step.completed .step-label,.status-step.active .step-label{color:var(--deep);font-weight:500}
.info-message{background:var(--blush);padding:1rem;border-radius:var(--radius-sm);text-align:center;margin-bottom:1.5rem;font-size:0.85rem;color:var(--deep)}
</style>
</head>
<body>
<nav id="navbar">
<div class="nav-inner">
<a href="index.html" class="logo">MAC<span>&</span>GLOW</a>
<ul class="nav-links" id="navLinks">
<li><a href="index.html">Home</a></li>
<li><a href="shop.html">Shop</a></li>
<li><a href="routines.html">Routines</a></li>
<li><a href="ingredients.html">Ingredients</a></li>
<li><a href="about.html">About</a></li>
<li><a href="journal.html">Journal</a></li>
</ul>
<div class="nav-actions">
<button class="icon-btn cart-btn" onclick="toggleCart()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg><span class="cart-count" id="cartCount">0</span></button>
<button class="hamburger" id="hamburger" onclick="toggleMenu()"><span></span><span></span><span></span></button>
</div>
</div>
</nav>
<div class="track-container">
<div class="track-card">
<div class="track-header"><div class="icon">📦</div><h1>Track Your Order</h1><p>Enter your order ID to check the status of your delivery</p></div>
<div id="trackContent"></div>
</div>
</div>
<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-sidebar" id="cartSidebar">
<div class="cart-header"><h3>Your Cart <span id="cartItemCount">(0)</span></h3><button onclick="toggleCart()">✕</button></div>
<div class="cart-items" id="cartItems"></div>
<div class="cart-footer" id="cartFooter" style="display:none"><div class="cart-total"><span>Subtotal</span><strong id="cartTotal">₹0</strong></div><p class="cart-note">Free shipping above ₹699</p><a href="checkout.html" class="btn-primary" style="width:100%;text-align:center;display:block;">Checkout →</a></div>
</div>
<div class="toast" id="toast"></div>
<footer style="background:var(--deep);padding:2rem 0;margin-top:3rem">
<div class="container" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem">
<a href="index.html" class="logo" style="color:#FAF7F2">MAC<span style="color:#C4856A">&</span>GLOW</a>
<p style="font-size:0.75rem;color:rgba(250,247,242,0.3)">© 2026 Mac & Glow Skincare. All rights reserved.</p>
</div>
</footer>
<script src="data.js"></script>
<script src="api.js"></script>
<script src="cart.js"></script>
<script src="main.js"></script>
<script src="nav.js"></script>
<script src="chatbot.js"></script>
<script>
function trackOrder(){var o=document.getElementById('orderId').value.trim(),r=document.getElementById('trackResult');if(!o){showToast('Please enter an order ID');return}MG_API.trackOrder(o).then(function(data){var order=data.order;var steps=['Confirmed','Processing','Shipped','Out for Delivery','Delivered'],step=0;if(order.status==='confirmed')step=0;else if(order.status==='processing')step=1;else if(order.status==='shipped')step=2;else if(order.status==='out_for_delivery')step=3;else if(order.status==='delivered')step=4;var stepsHtml='';for(var i=0;i<steps.length;i++){var cls='',txt=i+1;if(i<step){cls='completed';txt='✓'}else if(i===step){cls='active'}stepsHtml+='<div class="status-step '+cls+'"><div class="step-circle">'+txt+'</div><div class="step-label">'+steps[i]+'</div></div>'}var itemsHtml='';for(var j=0;j<order.items.length;j++){var it=order.items[j];itemsHtml+='<div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-top:0.5rem"><span>'+it.name+' x'+it.qty+'</span><span>₹'+(it.price*it.qty).toLocaleString()+'</span></div>'}r.innerHTML='<div class="order-details"><h3 style="font-family:var(--font-serif);margin-bottom:0.5rem">Order #'+order.orderId+'</h3><p style="font-size:0.8rem;color:var(--muted);margin-bottom:1rem">Placed on: '+new Date(order.createdAt).toLocaleString()+'</p><div class="order-status">'+stepsHtml+'</div><div style="margin-top:1.5rem;padding:1rem;background:var(--cream);border-radius:8px"><strong>Order Summary:</strong>'+itemsHtml+'<div style="border-top:1px solid var(--border);margin-top:0.8rem;padding-top:0.8rem;display:flex;justify-content:space-between;font-weight:bold"><span>Total Paid:</span><span>₹'+order.total.toLocaleString()+'</span></div></div></div>'}).catch(function(){r.innerHTML='<div style="background:#f8d7da;color:#721c24;padding:1rem;border-radius:8px;margin-top:1rem;text-align:center">⚠️ Order not found. Please check your order ID and try again.</div>'})}
document.addEventListener('DOMContentLoaded',function(){document.getElementById('trackContent').innerHTML='<div class="track-form"><div class="info-message">✨ Enter your order ID (e.g., MG1234567890) to track your shipment</div><div class="order-input-group"><input type="text" id="orderId" placeholder="Enter Order ID" autocomplete="off"><button onclick="trackOrder()">Track Order →</button></div><div id="trackResult"></div></div>';if(typeof updateCartUI==='function')updateCartUI()});
</script>
</body>
</html>
