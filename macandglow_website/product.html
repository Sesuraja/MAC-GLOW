<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — Mac & Glow</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="navbar">
  <div class="nav-inner">
    <a href="index.html" class="logo">MAC<span>&</span>GLOW</a>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html" class="active">Shop</a></li>
      <li><a href="routines.html">Routines</a></li>
      <li><a href="ingredients.html">Ingredients</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="journal.html">Journal</a></li>
    </ul>
    <div class="nav-actions">
      <button class="icon-btn cart-btn" onclick="toggleCart()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </button>
      <button class="hamburger" id="hamburger" onclick="toggleMenu()"><span></span><span></span><span></span></button>
    </div>
  </div>
</nav>

<div style="padding-top:var(--nav-h)">
  <div class="container">
    <div id="productDetail"></div>
    <div style="margin-top:4rem;padding-top:3rem;border-top:1px solid var(--border)">
      <p class="eyebrow"><span class="eyebrow-line"></span>You May Also Like</p>
      <h2 class="section-title" style="margin-bottom:2rem">Related <em>Products</em></h2>
      <div class="products-grid" id="relatedGrid" style="grid-template-columns:repeat(4,1fr)"></div>
    </div>
  </div>
</div>

<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-sidebar" id="cartSidebar">
  <div class="cart-header"><h3>Your Cart <span id="cartItemCount">(0)</span></h3><button onclick="toggleCart()">✕</button></div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer" id="cartFooter" style="display:none"><div class="cart-total"><span>Subtotal</span><strong id="cartTotal">₹0</strong></div><p class="cart-note">Free shipping above ₹699</p><a href="checkout.html" class="btn-primary" style="width:100%;text-align:center;display:block;">Checkout →</a></div>
</div>
<div class="toast" id="toast"></div>

<footer style="background:var(--deep);padding:2rem 0;margin-top:5rem">
  <div class="container" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem">
    <a href="index.html" class="logo" style="color:#FAF7F2">MAC<span style="color:#C4856A">&</span>GLOW</a>
    <p style="font-size:0.75rem;color:rgba(250,247,242,0.3)">© 2026 Mac & Glow Skincare</p>
  </div>
</footer>

<script src="data.js"></script>
<script src="api.js"></script>
<script src="cart.js"></script>
<script src="main.js"></script>
<script src="nav.js"></script>
<script src="chatbot.js"></script>
<script>
let qty = 1;
function changeQty(d) { qty = Math.max(1, qty + d); document.getElementById('qtyDisplay').textContent = qty; }

function showTab(tab) {
  document.querySelectorAll('.pd-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.pd-tab-content').forEach(c => c.classList.toggle('active', c.dataset.tab === tab));
}

document.addEventListener('DOMContentLoaded', () => {
  const id = parseInt(new URLSearchParams(location.search).get('id')) || 1;
  const p = PRODUCTS.find(x => x.id === id) || PRODUCTS[0];
  document.title = `${p.name} — Mac & Glow`;

  document.getElementById('productDetail').innerHTML = `
    <div class="product-detail-grid">
      <div>
        <p class="breadcrumb"><a href="index.html">Home</a> / <a href="shop.html">Shop</a> / ${p.name}</p>
        <div class="pd-img" style="background:${p.bg}">${p.icon}</div>
        <div style="display:flex;gap:0.6rem;margin-top:1rem">
          <div style="width:70px;height:70px;background:${p.bg};border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:1.8rem;cursor:pointer;border:2px solid var(--rose);">${p.icon}</div>
          <div style="width:70px;height:70px;background:${p.bg};border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:1.8rem;cursor:pointer;border:1px solid var(--border);">🌿</div>
          <div style="width:70px;height:70px;background:${p.bg};border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:1.8rem;cursor:pointer;border:1px solid var(--border);">✨</div>
        </div>
      </div>
      <div>
        ${p.badge ? `<span style="background:rgba(196,133,106,0.15);color:var(--rose);font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;padding:3px 10px;border-radius:100px;margin-bottom:0.8rem;display:inline-block">${p.badge}</span>` : ''}
        <h1 style="font-family:var(--font-serif);font-size:2.2rem;font-weight:300;color:var(--deep);margin:0.3rem 0 0.8rem">${p.name}</h1>
        <div class="pd-rating">
          <span>${'★'.repeat(Math.floor(p.rating))}${'☆'.repeat(5-Math.floor(p.rating))}</span>
          <small>${p.rating} · ${p.reviews} reviews</small>
        </div>
        <p style="font-size:0.9rem;color:var(--muted);line-height:1.8;margin-bottom:1rem">${p.fullDesc}</p>
        <div class="pd-price">₹${p.price.toLocaleString()}</div>
        <div class="pd-meta">
          <div class="pd-meta-item"><small>Size</small><strong>${p.size}</strong></div>
          <div class="pd-meta-item"><small>Skin type</small><strong>${p.skin}</strong></div>
          <div class="pd-meta-item"><small>Category</small><strong style="text-transform:capitalize">${p.category}</strong></div>
        </div>
        <div class="pd-qty">
          <label>Quantity</label>
          <div class="qty-control">
            <button onclick="changeQty(-1)">−</button>
            <span id="qtyDisplay">1</span>
            <button onclick="changeQty(1)">+</button>
          </div>
        </div>
        <div class="pd-actions">
          <button class="btn-primary" onclick="addToCart('${p.name}',${p.price},qty)" style="flex:1">Add to Cart</button>
          <button class="btn-ghost" onclick="showToast('Added to wishlist ♥')">♥ Wishlist</button>
          <button class="icon-btn" onclick="window.location.href='wishlist.html'">
        </div>
        <div style="margin-top:1.5rem;padding:1rem;background:var(--white);border-radius:var(--radius-sm);border:1px solid var(--border)">
          <div style="display:flex;gap:1.5rem;flex-wrap:wrap">
            <span style="font-size:0.78rem;color:var(--muted);display:flex;align-items:center;gap:0.4rem">🚚 Free shipping above ₹699</span>
            <span style="font-size:0.78rem;color:var(--muted);display:flex;align-items:center;gap:0.4rem">↩️ Easy 7-day returns</span>
            <span style="font-size:0.78rem;color:var(--muted);display:flex;align-items:center;gap:0.4rem">🌿 100% clean formula</span>
          </div>
        </div>
        <div class="pd-tabs">
          <div class="pd-tab-btns">
            <button class="pd-tab-btn active" data-tab="desc" onclick="showTab('desc')">Description</button>
            <button class="pd-tab-btn" data-tab="how" onclick="showTab('how')">How to Use</button>
            <button class="pd-tab-btn" data-tab="ings" onclick="showTab('ings')">Ingredients</button>
            <button class="pd-tab-btn" data-tab="reviews" onclick="showTab('reviews')">Reviews (${p.reviews})</button>
          </div>
          <div class="pd-tab-content active" data-tab="desc">
            <p>${p.fullDesc}</p>
            <ul style="margin-top:1rem;padding-left:1.2rem;display:flex;flex-direction:column;gap:0.4rem">
              ${p.tags.map(t => `<li style="font-size:0.85rem;color:var(--muted)">✓ ${t.replace('-',' ')}</li>`).join('')}
            </ul>
          </div>
          <div class="pd-tab-content" data-tab="how">
            <ol style="padding-left:1.2rem;display:flex;flex-direction:column;gap:0.6rem">
              <li>Cleanse your face and pat dry before applying.</li>
              <li>Apply 2-3 drops (or a small amount) to fingertips.</li>
              <li>Gently pat into skin using upward, circular motions.</li>
              <li>Allow to absorb fully before applying next product.</li>
              <li>Use morning and/or evening as directed.</li>
            </ol>
          </div>
          <div class="pd-tab-content" data-tab="ings">
            <p style="margin-bottom:0.8rem">Full ingredient list (INCI):</p>
            <p style="font-size:0.8rem;line-height:1.8;color:var(--muted)">Aqua, Niacinamide, Ascorbic Acid, Butylene Glycol, Sodium Hyaluronate, Panthenol, Allantoin, Rosa Canina Fruit Oil, Bakuchiol, Camellia Sinensis Leaf Extract, Tocopherol, Ceramide NP, Phenoxyethanol, Ethylhexylglycerin.</p>
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:1rem">
              ${p.tags.map(t => `<span class="ing-tag">${t.replace('-',' ')}</span>`).join('')}
            </div>
          </div>
          <div class="pd-tab-content" data-tab="reviews">
            <div style="border-bottom:1px solid var(--border);padding:1.2rem 0">
              <div style="display:flex;justify-content:space-between;margin-bottom:0.4rem">
                <strong style="font-size:0.85rem">Priya R.</strong>
                <span style="color:var(--gold);font-size:0.85rem">★★★★★</span>
              </div>
              <p style="font-size:0.85rem;color:var(--muted)">Absolutely love this! Noticeable difference in just 2 weeks.</p>
            </div>
            <div style="border-bottom:1px solid var(--border);padding:1.2rem 0">
              <div style="display:flex;justify-content:space-between;margin-bottom:0.4rem">
                <strong style="font-size:0.85rem">Sneha K.</strong>
                <span style="color:var(--gold);font-size:0.85rem">★★★★★</span>
              </div>
              <p style="font-size:0.85rem;color:var(--muted)">My skin barrier has completely healed. Cannot recommend enough.</p>
            </div>
            <div style="padding:1.2rem 0">
              <div style="display:flex;justify-content:space-between;margin-bottom:0.4rem">
                <strong style="font-size:0.85rem">Ananya M.</strong>
                <span style="color:var(--gold);font-size:0.85rem">★★★★★</span>
              </div>
              <p style="font-size:0.85rem;color:var(--muted)">So gentle yet effective. Perfect for sensitive skin.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;

  const related = PRODUCTS.filter(x => x.id !== p.id).slice(0, 4);
  document.getElementById('relatedGrid').innerHTML = related.map(renderProductCard).join('');
});
</script>
</body>
</html>
